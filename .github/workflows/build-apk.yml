name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dar permissão ao gradlew
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build APK (debug)
        id: build
        continue-on-error: true
        run: |
          ./gradlew assembleDebug --stacktrace > build_log.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Salvar log de build no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build_log.txt
          git commit -m "Log de build automático [skip ci]" || echo "Nada para commitar"
          git push || echo "Falha ao enviar log"

      - name: Falhar job se o build falhou
        if: steps.build.outputs.exit_code != '0'
        run: exit 1

      - name: Upload do APK gerado
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: baixador-capas-apk
          path: app/build/outputs/apk/debug/*.apk
